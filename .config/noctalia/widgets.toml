    [widget.Update.actions]
    left = "exec /home/bailey/.local/bin/update-launch.sh"
    right = "exec /home/bailey/.local/bin/update-launch.sh"

[widget.active_window]
scale = 0.80000000000000004

[widget.battery]
capsule_radius = "auto"
