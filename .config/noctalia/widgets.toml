show_label = false

[widget.bluetooth]
color = "on_secondary"
icon_color = "outline"
scale = 0.90000000000000013

[widget.brightness]
color = "outline"
icon_color = "#DB902D"
scale = 1.1500000000000001
show_label = false

[widget.clipboard]
color = "on_secondary"
icon_color = "outline"
scale = 0.90000000000000013

[widget.clock]
anchor = true
scale = 1.1500000000000001

[widget.control-center]
glyph = "adjustments"
scale = 1.1500000000000001

[widget.media]
enabled = false
hide_when_no_media = true

[widget.network]
color = "outline"
icon_color = "primary"
scale = 1.1500000000000001
show_label = false

[widget.nightlight]
icon_color = "secondary"
scale = 0.85000000000000009

[widget.notifications]
color = "outline"
icon_color = "on_surface"

[widget.session]
color = "outline"
icon_color = "error"
scale = 1.1500000000000001

[widget.taskbar]
workspace_group_capsule = false

[widget.tray]
detached_panel = true
drawer = true

[widget.volume]
color = "outline"
icon_color = "secondary"
scale = 1.1500000000000001
show_label = false

[widget.wallpaper]
color = "on_secondary"
icon_color = "outline"
scale = 0.90000000000000013

[widget.workspaces]
font_family = "Adwaita Mono"
style = "minimal"       # regular | minimal | focus_hint
show_labels = true      # false = unlabeled pills (Focus Hint: app icon only)
show_icons = false       # focus_hint only; false = active pill without the focused app icon
label_source = "name"   # id | name
max_label_chars = 10    # truncate long workspace names (e.g. "VESKTOP" → "VE")
labels_only_when_occupied = false # (1) (2*) ( ) (4) - occupied tags and the active tag show labels (*active but empty)
hide_when_empty = true
show_all_outputs = true  # true = include workspaces from every monitor; this bar's monitor comes first
pill_scale = 1.0
active_pill_size = 2.2
inactive_pill_size = 1.0
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_variant"
urgent_color = "error"
change_color_on_hover = true  # false = keep configured workspace colors while hovering
focused_output_only = false  # true = only the focused monitor highlights its active workspace
