# Styling adapted from Omarchy's tmux.conf (MIT), recoloured to Catppuccin Frappé
# to match nvim and zathura. Keybinds are tmux's stock ones.
# https://github.com/basecamp/omarchy/blob/quattro/config/tmux/tmux.conf
#
# Frappé: blue #8caaee  text #c6d0f5  overlay0 #737994  surface0 #414559  base #303446

# Proper colours (true colour) inside tmux
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Keybindings popup: readable list of every bind (q to close)
bind -N "Show keybindings" ? display-popup -E -w 80% -h 70% -T " Tmux keybindings " "~/.config/tmux/keybindings.sh | less -R"

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme (bg=default keeps kitty's transparency/blur)
set -g status-style "bg=default,fg=#c6d0f5"
set -g status-left "#[fg=#303446,bg=#8caaee,bold] #S #[bg=default] "
set -g status-right "#[fg=#8caaee]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#737994]#h "
set -g window-status-format "#[fg=#737994] #I:#W "
set -g window-status-current-format "#[fg=#8caaee,bold] #I:#W "
set -g pane-border-style "fg=#737994"
set -g pane-active-border-style "fg=#8caaee"
set -g message-style "bg=default,fg=#8caaee"
set -g message-command-style "bg=default,fg=#8caaee"
set -g mode-style "bg=#8caaee,fg=#303446"
setw -g clock-mode-colour "#8caaee"

# Menus (prefix < / prefix >) and popups, to match
set -g menu-style "bg=#303446,fg=#c6d0f5"
set -g menu-selected-style "bg=#8caaee,fg=#303446"
set -g menu-border-style "fg=#8caaee"
set -g menu-border-lines rounded
set -g popup-style "bg=#303446,fg=#c6d0f5"
set -g popup-border-style "fg=#8caaee"
set -g popup-border-lines rounded
