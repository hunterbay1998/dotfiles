# Root editing. `sudo -e` (sudoedit) copies the file to a temp path, opens it as
# *you*, then writes it back as root — your editor never runs with root.
[[mgr.prepend_keymap]]
on   = "E"
run  = "shell --block -- sudo -e %s"
desc = "Edit as root (sudoedit)"

# Fallback: runs the editor itself as root. Use if sudoedit is disabled.
[[mgr.prepend_keymap]]
on   = [ "R", "e" ]
run  = 'shell --block -- sudo -E ${EDITOR:-nano} %s'
desc = "Edit as root (editor runs as root)"

# toggle-pane.yazi: press again to restore the normal layout.
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = "<C-p>"
run  = "plugin toggle-pane min-preview"
desc = "Hide or show the preview pane"
