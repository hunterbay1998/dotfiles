[mgr]
show_hidden    = true
show_symlink   = true
sort_by        = "natural"
sort_dir_first = true
sort_sensitive = false
linemode       = "size"
ratio          = [1, 3, 4]

[preview]
max_width  = 1200
max_height = 1800

[opener]
# Overrides the default `edit` opener (used for text files + folders).
# `o` runs the first entry; `O` opens the menu so you can pick a sudo variant.
edit = [
  { run = '${EDITOR:-nano} %s',         desc = "$EDITOR",           for = "unix", block = true },
  { run = 'sudo -e %s',                 desc = "sudoedit (root)",   for = "unix", block = true },
  { run = 'sudo -E ${EDITOR:-nano} %s', desc = "sudo $EDITOR (root)", for = "unix", block = true },
]
