[mgr]
show_hidden    = true
show_symlink   = true
sort_by        = "natural"
sort_dir_first = true
sort_sensitive = false
linemode       = "size"
ratio          = [1, 3, 4]

[preview]
max_width  = 1200
max_height = 1800

[opener]
# Overrides the default `edit` opener (used for text files + folders).
# `o` runs the first entry; `O` opens the menu so you can pick a sudo variant.
edit = [
  { run = '${EDITOR:-nano} %s',         desc = "$EDITOR",           for = "unix", block = true },
  { run = 'sudo -e %s',                 desc = "sudoedit (root)",   for = "unix", block = true },
  { run = 'sudo -E ${EDITOR:-nano} %s', desc = "sudo $EDITOR (root)", for = "unix", block = true },
]
# PDFs and EPUBs. `orphan` keeps zathura open if yazi/the terminal closes.
zathura = [
  { run = 'zathura %s', orphan = true, desc = "Zathura", for = "unix" },
]
# Videos
mpv = [
  { run = 'mpv %s', orphan = true, desc = "mpv", for = "unix" },
]
# Images. Opens the whole folder starting at this file, so ←/→ flips through it.
imv = [
  { run = 'imv -n %s1 "$(dirname %s1)"', orphan = true, desc = "imv (browse folder)", for = "unix" },
  { run = 'imv %s',                      orphan = true, desc = "imv (selected only)", for = "unix" },
]

[open]
# Checked before yazi's built-in rules. Archives use the built-in rule
# (Enter extracts via 7zip).
prepend_rules = [
  { mime = "application/{pdf,epub+zip}", use = [ "zathura", "reveal" ] },
  { mime = "video/*",                    use = [ "mpv", "reveal" ] },
  { mime = "image/*",                    use = [ "imv", "reveal" ] },
]

[plugin]
# git.yazi: fetch git status for files and folders
prepend_fetchers = [
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
